<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PagoClaro - Cobros sin enredos</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Capa para la cuadrícula financiera de fondo -->
    <div class="fondo-grid"></div>

    <!-- Contenedor principal de la aplicación -->
    <div class="contenedor-app">
        
        <!-- Logo Premium de PagoClaro -->
        <div class="logo-contenedor">
            <svg class="logo-icono" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 18V6M6 6L2 10M6 6L10 10" stroke="url(#grad-azul)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M18 6v12M18 18l-4-4M18 18l4-4" stroke="url(#grad-verde)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="grad-azul" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00d2ff"/><stop offset="100%" stop-color="#00a6ff"/></linearGradient>
                    <linearGradient id="grad-verde" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
                </defs>
            </svg>
            <h1 class="logo-texto">Pago<span class="logo-resalto">Claro</span></h1>
        </div>

        <!-- Indicador Dinámico "En Vivo" -->
        <div class="indicador-en-vivo">
            <span class="punto-pulso"></span>
            <span class="texto-en-vivo">Tasas de mercado en tiempo real</span>
        </div>

        <!-- Cuerpo de la aplicación -->
        <main>
            <!-- Bloque superior de Tasas -->
            <section class="tasas-container">
                <div class="tasa-card">
                    <h3>BCV</h3>
                    <p id="tasa-bcv">--- Bs</p>
                </div>

                <div class="tasa-card">
                    <h3>Diferencia cambiaria</h3>
                    <div class="bloque-precio">
                        <p id="tasa-paralelo">--- Bs</p>
                        <span id="brecha-badge" class="badge-brecha">+0.0%</span>
                    </div>
                    <p class="diferencia-subtexto">
                        Son <span id="brecha-bs">0.00</span> Bs más que el BCV
                    </p>
                </div>

                <div class="tasa-card">
                    <h3>USDT</h3>
                    <p id="tasa-usdt">--- Bs</p>
                </div>
            </section>

            <!-- Bloque de la Calculadora -->
            <section class="calculadora-container">
                <h2>Calculadora Inteligente</h2>
                
                <div class="form-group">
                    <label for="monto-base">Monto que deseas recibir (USD netos):</label>
                    <input type="number" id="monto-base" placeholder="Ej. 40" min="1" step="0.01">
                </div>

                <div class="form-group">
                    <label for="metodo-pago">¿Cómo te van a pagar?</label>
                    <select id="metodo-pago">
                        <option value="bcv">Pago Móvil / Transferencia (Bs a tasa BCV)</option>
                        <option value="usdt">Binance Pay (USDT)</option>
                        <option value="paypal">PayPal (Calcula la comisión exacta)</option>
                        <option value="zelle">Zelle / Efectivo (Monto exacto)</option>
                    </select>
                </div>

                <div class="resultado-box">
                    <h3>Al cliente debes cobrarle:</h3>
                    <p id="monto-cobrar" class="monto-final">$0.00</p>
                </div>

                <div class="recibo-box">
                    <h3>Recibo Express</h3>
                    <p class="helper-text">Copia esto y envíalo directo por WhatsApp</p>
                    <textarea id="texto-recibo" readonly rows="6">Ingresa un monto para generar tu recibo...</textarea>
                    <button id="btn-copiar">Copiar para WhatsApp 📋</button>
                </div>
            </section>
        </main>
    </div> <!-- Cierre correcto de contenedor-app -->

    <script src="app.js"></script>
</body>
</html>
